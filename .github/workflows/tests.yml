name: Test batch downloads

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/tg-ui" playwright@1.64.0
          "$RUNNER_TEMP/tg-ui/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test web queue against backend fixtures
        run: NODE_PATH="$RUNNER_TEMP/tg-ui/node_modules" node --test tests/test_queue_ui.cjs
